<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fișă atelier">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="apple-touch-startup-image" href="startup-ipad-portrait.png" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="startup-ipad-landscape.png" media="(device-width: 1180px) and (device-height: 820px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)">
  <title>Notițe pe imagini</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #29261f; background: #edeae4; }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; background: radial-gradient(circle at 0% 0%, #f8f5ee 0, transparent 38%), linear-gradient(135deg, #ebe8e1 0%, #f5f2ec 55%, #e9e4db 100%); }
    button, textarea { font: inherit; }
    button { min-height: 52px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; border: 1px solid #d8d1c6; border-radius: 13px; background: #fdfcf9; color: #423d33; padding: 11px 17px; font-size: .92rem; font-weight: 650; letter-spacing: -.01em; box-shadow: 0 1px 2px rgba(55, 46, 34, .05); transition: transform .16s ease, box-shadow .16s ease, background .16s ease, border-color .16s ease; -webkit-tap-highlight-color: transparent; }
    button svg { width: 19px; height: 19px; flex: 0 0 auto; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    button:hover:not(:disabled) { transform: translateY(-1px); border-color: #afa18f; box-shadow: 0 8px 18px rgba(65, 52, 34, .10); }
    button:active:not(:disabled) { transform: translateY(1px) scale(.985); box-shadow: none; }
    button:focus-visible, #notes:focus { outline: 3px solid rgba(107, 86, 59, .36); outline-offset: 3px; }
    button:disabled { cursor: not-allowed; border-color: #e6e1d9; background: #f5f2ed; color: #afa89e; box-shadow: none; }
    .app { max-width: 1380px; margin: 0 auto; padding: clamp(18px, 3vw, 42px); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 20px 18px 24px; border: 1px solid rgba(136, 119, 91, .16); border-radius: 20px; background: rgba(255, 254, 251, .76); box-shadow: 0 12px 32px rgba(63, 51, 35, .08); backdrop-filter: blur(10px); }
    .header-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
    h1 { position: relative; margin: 0; padding-left: 16px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.38rem, 2.8vw, 2rem); font-weight: 600; letter-spacing: -.035em; color: #332d23; }
    h1::before { position: absolute; left: 0; top: .16em; bottom: .16em; width: 4px; border-radius: 4px; background: #876c47; content: ""; }
    #addImage, #save { border-color: #4b4133; background: #4b4133; color: #fffdfa; box-shadow: 0 7px 16px rgba(50, 41, 29, .18); }
    #addImage:hover:not(:disabled), #save:hover:not(:disabled) { border-color: #342c22; background: #342c22; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(360px, .8fr); gap: clamp(20px, 2.5vw, 34px); padding-top: clamp(20px, 3vw, 32px); align-items: stretch; }
    .image-panel, .notes { min-width: 0; border: 1px solid rgba(136, 119, 91, .17); border-radius: 22px; background: rgba(255, 254, 251, .87); box-shadow: 0 15px 38px rgba(62, 49, 31, .09); }
    .image-panel { padding: clamp(15px, 2vw, 22px); }
    .section-label { display: flex; align-items: center; margin: 0 0 14px; color: #655947; font-size: .7rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .section-label::after { height: 1px; flex: 1; margin-left: 12px; background: #e8e2d9; content: ""; }
    .canvas-shell { min-height: clamp(390px, 59vh, 700px); display: grid; place-items: center; overflow: hidden; border: 1px solid #e3ddd3; border-radius: 16px; background: repeating-linear-gradient(45deg, #f5f1eb 0, #f5f1eb 8px, #f8f6f1 8px, #f8f6f1 16px); box-shadow: inset 0 1px 1px rgba(71, 56, 35, .04); overscroll-behavior: contain; }
    .image-stage { position: relative; display: inline-block; max-width: 100%; line-height: 0; box-shadow: 0 7px 20px rgba(56, 43, 26, .16); }
    #photo { display: block; max-width: 100%; max-height: min(66vh, 760px); width: auto; height: auto; }
    #drawingCanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .note-layer { position: absolute; inset: 0; pointer-events: none; }
    .note-marker { position: absolute; display: grid; place-items: center; width: 42px; height: 42px; transform: translate(-50%, -50%); border: 0; border-radius: 999px; background: linear-gradient(140deg, #8b5e3c, #6a3d22); color: #fffdfa; font-weight: 800; font-size: .95rem; box-shadow: 0 10px 20px rgba(61, 39, 23, .24); cursor: grab; pointer-events: auto; -webkit-tap-highlight-color: transparent; }
    .note-marker:active { cursor: grabbing; }
    .note-marker.selected { background: linear-gradient(140deg, #2f6f51, #1f4e3d); transform: translate(-50%, -50%) scale(1.06); }
    .empty { max-width: 290px; padding: 28px; color: #7c7265; text-align: center; font-size: .95rem; line-height: 1.6; }
    .toolbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
    .toolbar button { width: 100%; padding-inline: 12px; }
    .fullscreen-inline { display: flex; gap: 10px; margin: 12px 0 8px; }
    .fullscreen-inline button { flex: 1; min-height: 44px; }
    .mode-switcher { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 12px 0 8px; }
    .mode-switcher button { width: 100%; min-height: 44px; }
    .mode-switcher button.active { border-color: #8b5e3c; background: #fbf2e8; color: #5a3a22; }
    #clear { background: #f5f0e8; }
    .notes { display: flex; flex-direction: column; min-height: 0; padding: clamp(18px, 2.3vw, 25px); }
    .notes-toolbar { display: flex; gap: 10px; margin-bottom: 12px; }
    .notes-toolbar button { flex: 1; min-height: 44px; }
    .note-list { display: grid; gap: 10px; margin-bottom: 14px; }
    .note-list-item { width: 100%; border: 1px solid #e3ddd3; border-radius: 14px; padding: 12px 13px; background: #fdfcf9; text-align: left; color: #322c23; box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
    .note-list-item.selected { border-color: #8b5e3c; background: #fbf2e8; }
    .note-list-item strong { display: block; font-size: .95rem; }
    .note-list-item small { display: block; margin-top: 4px; color: #7a7267; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .note-form { display: grid; gap: 10px; }
    .note-form label { color: #655947; font-size: .72rem; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    .note-form input, .note-form textarea { width: 100%; border: 1px solid #e2dbd1; border-radius: 12px; padding: 12px 13px; color: #322c23; background: linear-gradient(#fffefa, #fbf8f2); font-size: 15px; }
    .note-form textarea { min-height: 120px; resize: vertical; }
    .note-input-toolbar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 6px; }
    .note-input-toolbar button { min-height: 42px; padding-inline: 10px; }
    .note-input-toolbar button.active { border-color: #8b5e3c; background: #fbf2e8; color: #5a3a22; }
    .handwriting-panel { display: grid; gap: 8px; padding: 10px; border: 1px solid #e2dbd1; border-radius: 12px; background: linear-gradient(#fffefa, #fbf8f2); }
    .handwriting-panel canvas { width: 100%; min-height: 220px; border: 1px solid #e3ddd3; border-radius: 10px; background: #fffdf9; touch-action: none; }
    .handwriting-actions { display: flex; gap: 8px; }
    .handwriting-actions button { flex: 1; min-height: 40px; }
    .help { display: flex; align-items: center; gap: 8px; margin: 14px 2px 0; color: #83796b; font-size: .79rem; line-height: 1.45; }
    .help::before { width: 5px; height: 5px; flex: 0 0 auto; border-radius: 50%; background: #a48358; content: ""; }
    .sr-only { position: fixed; top: 0; left: -9999px; width: 1px; height: 1px; padding: 0; margin: 0; overflow: hidden; opacity: 0; clip: auto; white-space: nowrap; border: 0; }
    .fullscreen-overlay { position: fixed; inset: 0; z-index: 1400; display: none; align-items: stretch; justify-content: stretch; padding: 0; background: #000; }
    .fullscreen-overlay.is-active { display: flex; }
    body.fullscreen-mode { overflow: hidden; background: #000; }
    body.fullscreen-mode .app { padding: 0; }
    body.fullscreen-mode header { display: none; }
    body.fullscreen-mode .layout { display: block; padding: 0; }
    body.fullscreen-mode .notes { display: none; }
    body.fullscreen-mode .image-panel.fullscreen-panel { position: relative; width: 100%; height: 100%; z-index: 1; border: 0; border-radius: 0; padding: 0; background: #000; box-shadow: none; }
    body.fullscreen-mode .image-panel.fullscreen-panel .section-label, body.fullscreen-mode .image-panel.fullscreen-panel .help { display: none; }
    body.fullscreen-mode .image-panel.fullscreen-panel .canvas-shell { min-height: 100vh; height: 100vh; width: 100vw; border: 0; border-radius: 0; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 0; }
    body.fullscreen-mode .image-panel.fullscreen-panel .image-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; max-width: none; width: 100%; height: 100%; margin: 0; }
    body.fullscreen-mode .image-panel.fullscreen-panel .image-stage #photo { max-height: none; width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    body.fullscreen-mode .mode-switcher { display: none; }
    body.fullscreen-mode .toolbar { position: fixed; left: 50%; transform: translateX(-50%); z-index: 1500; width: min(420px, calc(100vw - 32px)); bottom: 16px; margin: 0; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    body.fullscreen-mode .toolbar button { backdrop-filter: blur(10px); background: rgba(253, 252, 249, .9); box-shadow: 0 10px 25px rgba(0, 0, 0, .18); }
    body.fullscreen-mode .fullscreen-inline { position: fixed; left: 16px; top: 16px; z-index: 1500; width: auto; }
    body.fullscreen-mode .fullscreen-inline button { min-width: 132px; }
    body.fullscreen-mode #exitFullscreenBtn { display: inline-flex; }
    body.fullscreen-mode #fullscreenBtn { display: none; }
    @media (orientation: portrait), (max-width: 800px) {
      .app { padding: 16px; }
      header { align-items: stretch; flex-direction: column; padding: 18px; }
      #addImage { width: 100%; }
      .layout { grid-template-columns: 1fr; gap: 20px; padding-top: 20px; }
      .canvas-shell { min-height: min(58vh, 580px); }
      #notes { min-height: 300px; }
    }
    @media (max-width: 520px) {
      .toolbar { grid-template-columns: 1fr; }
      .canvas-shell { min-height: 310px; }
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div id="fullscreenOverlay" class="fullscreen-overlay" hidden></div>
  <main class="app">
    <header>
      <h1>Notițe interactive pe imagine</h1>
      <div class="header-actions">
        <button type="button" id="loadProject"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 20h14"></path></svg><span>Încarcă proiect</span></button>
        <button type="button" id="addImage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 8l5-5 5 5"></path><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg><span>Adaugă imagine</span></button>
        <button type="button" id="removeImage" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M6 7l1 13h10l1-13"></path><path d="M9 7V4h6v3"></path></svg><span>Șterge imaginea</span></button>
        <input class="sr-only" id="imageInput" type="file" accept="image/*" multiple>
        <input class="sr-only" id="projectInput" type="file" accept="application/json,.json">
      </div>
    </header>

    <div class="layout">
      <section class="image-panel" aria-labelledby="imageLabel">
        <span class="section-label" id="imageLabel">Imagine</span>
        <div class="canvas-shell" id="canvasShell">
          <div class="empty" id="emptyState">Adaugă o fotografie pentru a putea desena pe ea.</div>
          <div class="image-stage" id="imageStage" hidden>
            <img id="photo" alt="Fotografia încărcată">
            <canvas id="drawingCanvas" aria-label="Zonă de desen pe imagine"></canvas>
            <div class="note-layer" id="noteLayer" hidden></div>
          </div>
        </div>
        <div class="fullscreen-inline">
          <button type="button" id="fullscreenBtn" disabled>Ecran complet</button>
          <button type="button" id="exitFullscreenBtn" hidden>Înapoi</button>
        </div>
        <div class="mode-switcher" role="toolbar" aria-label="Mod de lucru">
          <button type="button" id="drawModeBtn" class="active">Desen</button>
          <button type="button" id="notesModeBtn">Note</button>
        </div>
        <div class="toolbar" aria-label="Instrumente desen">
          <button type="button" id="undo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 6 6v1"></path></svg><span>Înapoi</span></button>
          <button type="button" id="clear" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M6 7l1 13h10l1-13"></path><path d="M9 7V4h6v3"></path></svg><span>Șterge tot</span></button>
          <button type="button" id="save" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 20h14"></path></svg><span>Salvează</span></button>
        </div>
        <p class="help">Selectează modul Desen pentru a utiliza Apple Pencil sau degetul pe imagine. În modul Note poți muta marcatorii și edita textul.</p>
      </section>

      <section class="notes" aria-labelledby="notesLabel">
        <label class="section-label" id="notesLabel">Notițe interactive</label>
        <div class="notes-toolbar">
          <button type="button" id="addNote">Adaugă notă</button>
          <button type="button" id="deleteSelectedNote" disabled>Șterge nota</button>
        </div>
        <div class="note-list" id="noteList" aria-live="polite"></div>
        <div class="note-form">
          <label for="noteTitle">Titlu</label>
          <input id="noteTitle" type="text" placeholder="Ex.: Detaliu important">
          <label for="noteContent">Conținut</label>
          <div class="note-input-toolbar" role="toolbar" aria-label="Mod conținut notă">
            <button type="button" id="textModeBtn" class="active">Text</button>
            <button type="button" id="pencilModeBtn">✏️ Scrie cu Apple Pencil</button>
          </div>
          <textarea id="noteContent" placeholder="Scrie observații, măsurători sau idei pentru această zonă…"></textarea>
          <div class="handwriting-panel" id="handwritingPanel" hidden>
            <canvas id="noteCanvas" aria-label="Zonă de scriere cu Apple Pencil"></canvas>
            <div class="handwriting-actions">
              <button type="button" id="clearPencilInput">Șterge scrierea</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      const addImage = document.getElementById('addImage');
      const removeImageButton = document.getElementById('removeImage');
      const imageInput = document.getElementById('imageInput');
      const loadProjectButton = document.getElementById('loadProject');
      const projectInput = document.getElementById('projectInput');
      const photo = document.getElementById('photo');
      const canvas = document.getElementById('drawingCanvas');
      const stage = document.getElementById('imageStage');
      const noteLayer = document.getElementById('noteLayer');
      const emptyState = document.getElementById('emptyState');
      const undo = document.getElementById('undo');
      const clear = document.getElementById('clear');
      const save = document.getElementById('save');
      const drawModeButton = document.getElementById('drawModeBtn');
      const notesModeButton = document.getElementById('notesModeBtn');
      const fullscreenButton = document.getElementById('fullscreenBtn');
      const exitFullscreenButton = document.getElementById('exitFullscreenBtn');
      const addNoteButton = document.getElementById('addNote');
      const deleteSelectedNoteButton = document.getElementById('deleteSelectedNote');
      const noteList = document.getElementById('noteList');
      const noteTitleInput = document.getElementById('noteTitle');
      const noteContentTextarea = document.getElementById('noteContent');
      const textModeButton = document.getElementById('textModeBtn');
      const pencilModeButton = document.getElementById('pencilModeBtn');
      const handwritingPanel = document.getElementById('handwritingPanel');
      const noteCanvas = document.getElementById('noteCanvas');
      const clearPencilInputButton = document.getElementById('clearPencilInput');
      const fullscreenOverlay = document.getElementById('fullscreenOverlay');
      const overlay = fullscreenOverlay;
      const layout = document.querySelector('.layout');
      const imagePanel = document.querySelector('.image-panel');
      const noteCanvasCtx = noteCanvas.getContext('2d');
      const ctx = canvas.getContext('2d');
      let strokes = [];
      let activeStroke = null;
      let sourceImage = null;
      let currentObjectUrl = null;
      let imageBlob = null;
      let saveTimer = null;
      let interactiveNotes = [];
      let selectedNoteId = null;
      let draggingNoteId = null;
      let activeTool = 'draw';
      let selectedNoteMode = 'text';
      let activePencilStroke = null;
      let zoomLevel = 1;
      let panOffset = { x: 0, y: 0 };
      let panning = false;
      let panStart = null;
      let panOrigin = null;
      let fullscreenMode = false;
      let fullscreenFrame = { width: 0, height: 0 };
      let fullscreenAbortController = null;
      let activeDrawingPointerId = null;
      let activeWritingPointerId = null;
      let isDrawing = false;
      let isDraggingNote = false;
      let isPanning = false;
      let activeTouches = new Map();
      let pinchStartDistance = 0;
      let pinchStartZoom = 1;
      let pinchCenter = null;
      const databaseName = 'fisa-atelier-offline';
      const databaseStore = 'lucrari';
      const projectVersion = 2;

      function openDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(databaseName, 1);
          request.onupgradeneeded = () => request.result.createObjectStore(databaseStore);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      function blobToDataUrl(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(blob);
        });
      }

      function dataUrlToFile(dataUrl, name = 'imagine.png') {
        return fetch(dataUrl)
          .then((response) => response.blob())
          .then((blob) => new File([blob], name, { type: blob.type || 'image/png' }));
      }

      async function buildProjectPayload() {
        const payload = {
          version: projectVersion,
          updatedAt: new Date().toISOString(),
          image: null,
          drawing: { strokes },
          notes: interactiveNotes,
          ui: {
            activeTool,
            selectedNoteId,
            selectedNoteMode,
            zoom: zoomLevel,
            pan: panOffset
          }
        };

        if (imageBlob) {
          payload.image = {
            name: imageBlob.name || 'imagine.png',
            type: imageBlob.type || 'image/png',
            dataUrl: await blobToDataUrl(imageBlob)
          };
        }

        return payload;
      }

      async function saveLastWork(projectOverride = null) {
        try {
          const database = await openDatabase();
          const transaction = database.transaction(databaseStore, 'readwrite');
          const payload = projectOverride || await buildProjectPayload();
          transaction.objectStore(databaseStore).put(payload, 'ultima-lucrare');
          transaction.oncomplete = () => database.close();
        } catch (error) {
          console.warn('Lucrarea nu a putut fi salvată local.', error);
        }
      }

      function scheduleSave() {
        window.clearTimeout(saveTimer);
        saveTimer = window.setTimeout(() => saveLastWork(), 350);
      }

      function resetFullscreenLayoutStyles() {
        const shell = document.getElementById('canvasShell');
        if (shell) {
          shell.style.width = '';
          shell.style.height = '';
        }
        if (stage) {
          stage.style.width = '';
          stage.style.height = '';
          stage.style.transform = '';
          stage.style.transformOrigin = '';
        }
      }

      function updateFullscreenFrame() {
        if (!fullscreenMode) return;
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        fullscreenFrame = { width: viewportWidth, height: viewportHeight };
        const shell = document.getElementById('canvasShell');
        if (shell) {
          shell.style.width = `${viewportWidth}px`;
          shell.style.height = `${viewportHeight}px`;
        }
        if (stage) {
          stage.style.width = `${viewportWidth}px`;
          stage.style.height = `${viewportHeight}px`;
        }
      }

      function updateImageTransform() {
        if (!sourceImage) {
          stage.style.transform = '';
          stage.style.transformOrigin = '0 0';
          return;
        }
        if (!fullscreenMode) {
          stage.style.transform = '';
          stage.style.transformOrigin = '0 0';
          return;
        }
        stage.style.transform = `translate(${panOffset.x}px, ${panOffset.y}px) scale(${zoomLevel})`;
        stage.style.transformOrigin = '0 0';
      }

      function applyProjectState(project) {
        const notes = Array.isArray(project?.notes) ? project.notes : [];
        const strokesFromProject = Array.isArray(project?.drawing?.strokes) ? project.drawing.strokes : [];
        const ui = project?.ui || {};
        strokes = strokesFromProject;
        interactiveNotes = notes;
        selectedNoteId = interactiveNotes.find((note) => note.id === ui.selectedNoteId)?.id || interactiveNotes[0]?.id || null;
        activeTool = ui.activeTool === 'notes' ? 'notes' : 'draw';
        selectedNoteMode = ui.selectedNoteMode === 'pencil' ? 'pencil' : 'text';
        zoomLevel = typeof ui.zoom === 'number' ? ui.zoom : 1;
        panOffset = ui.pan && typeof ui.pan.x === 'number' && typeof ui.pan.y === 'number'
          ? { x: ui.pan.x, y: ui.pan.y }
          : { x: 0, y: 0 };
        setActiveTool(activeTool);
        updateImageTransform();
        renderNotes();
        renderNoteList();
        syncSelectedNoteForm();
        setControls();
      }

      async function restoreProject(project) {
        if (!project) return;
        if (project.image?.dataUrl) {
          try {
            const file = await dataUrlToFile(project.image.dataUrl, project.image.name || 'imagine.png');
            await loadImage(file, { storedStrokes: project.drawing?.strokes || [], storedNotes: project.notes || [], shouldPersist: false });
          } catch (error) {
            console.warn('Proiectul nu a putut fi restaurat.', error);
          }
        } else if (project.image) {
          await loadImage(project.image, { storedStrokes: project.drawing?.strokes || [], storedNotes: project.notes || [], shouldPersist: false });
        }
        applyProjectState(project);
      }

      async function restoreLastWork() {
        try {
          const database = await openDatabase();
          const transaction = database.transaction(databaseStore, 'readonly');
          const request = transaction.objectStore(databaseStore).get('ultima-lucrare');
          request.onsuccess = async () => {
            const work = request.result;
            database.close();
            if (!work) return;
            if (work.version) {
              await restoreProject(work);
            } else if (work.image) {
              await loadImage(work.image, { storedStrokes: work.strokes || [], storedNotes: work.interactiveNotes || [], shouldPersist: false });
              applyProjectState({
                notes: work.interactiveNotes || [],
                drawing: { strokes: work.strokes || [] },
                ui: { activeTool: 'draw', selectedNoteId: null, selectedNoteMode: 'text', zoom: 1, pan: { x: 0, y: 0 } }
              });
            }
          };
          request.onerror = () => database.close();
        } catch (error) {
          console.warn('Lucrarea anterioară nu a putut fi restaurată.', error);
        }
      }

      function setControls() {
        const ready = Boolean(sourceImage);
        undo.disabled = !ready || strokes.length === 0 || activeTool !== 'draw';
        clear.disabled = !ready || strokes.length === 0 || activeTool !== 'draw';
        save.disabled = !ready;
        fullscreenButton.disabled = !ready;
        removeImageButton.disabled = !ready;
        addNoteButton.disabled = !ready || activeTool !== 'notes';
        deleteSelectedNoteButton.disabled = !ready || !selectedNoteId || activeTool !== 'notes';
      }

      function setActiveTool(tool) {
        activeTool = tool;
        drawModeButton.classList.toggle('active', tool === 'draw');
        notesModeButton.classList.toggle('active', tool === 'notes');
        canvas.style.cursor = tool === 'draw' ? 'crosshair' : 'default';
        setControls();
      }

      function configureCanvas() {
        const rect = photo.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.round(rect.width * ratio);
        canvas.height = Math.round(rect.height * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        redraw();
      }

      function drawStroke(stroke) {
        if (!stroke || stroke.points.length === 0) return;
        const rect = photo.getBoundingClientRect();
        ctx.save();
        ctx.strokeStyle = '#000';
        ctx.fillStyle = '#000';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        const first = stroke.points[0];
        ctx.moveTo(first.x * rect.width, first.y * rect.height);
        if (stroke.points.length === 1) {
          ctx.arc(first.x * rect.width, first.y * rect.height, 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          for (let index = 1; index < stroke.points.length; index += 1) {
            const point = stroke.points[index];
            ctx.lineTo(point.x * rect.width, point.y * rect.height);
          }
          ctx.stroke();
        }
        ctx.restore();
      }

      function redraw() {
        const rect = photo.getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);
        strokes.forEach(drawStroke);
        if (activeStroke) drawStroke(activeStroke);
      }

      function pointFromEvent(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width)),
          y: Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height))
        };
      }

      function beginDrawing(event) {
        if (!sourceImage || activeTool !== 'draw' || event.altKey) return;
        if (event.pointerType === 'mouse' && event.button !== undefined && event.button !== 0) return;
        event.preventDefault();
        canvas.setPointerCapture(event.pointerId);
        activeDrawingPointerId = event.pointerId;
        isDrawing = true;
        activeStroke = { points: [pointFromEvent(event)] };
        redraw();
      }

      function continueDrawing(event) {
        if (!activeStroke) return;
        event.preventDefault();
        activeStroke.points.push(pointFromEvent(event));
        redraw();
      }

      function finishDrawing(event) {
        if (!activeStroke) return;
        event.preventDefault();
        releasePointerCapture(canvas, event.pointerId ?? activeDrawingPointerId);
        activeDrawingPointerId = null;
        isDrawing = false;
        strokes.push(activeStroke);
        activeStroke = null;
        redraw();
        setControls();
        saveLastWork();
      }

      function createNoteId() {
        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function renderNoteList() {
        noteList.innerHTML = '';
        if (!interactiveNotes.length) {
          const empty = document.createElement('div');
          empty.className = 'note-list-item';
          empty.innerHTML = '<strong>Nu există încă note</strong><small>Adaugă una pentru a marca zone importante pe imagine.</small>';
          noteList.appendChild(empty);
          return;
        }
        interactiveNotes.forEach((note) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = `note-list-item${selectedNoteId === note.id ? ' selected' : ''}`;
          item.innerHTML = `<strong>${escapeHtml(note.title || 'Notă')}</strong><small>${escapeHtml(note.content ? note.content.split(/\n/)[0] : 'Fără conținut')}</small>`;
          item.addEventListener('click', () => selectNote(note.id));
          noteList.appendChild(item);
        });
      }

      function syncSelectedNoteForm() {
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        noteTitleInput.value = note ? note.title : '';
        noteContentTextarea.value = note ? note.content : '';
        setSelectedNoteMode(note && note.inputMode === 'pencil' ? 'pencil' : 'text');
        renderHandwritingCanvas();
      }

      function configureNoteCanvas() {
        const rect = noteCanvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const ratio = window.devicePixelRatio || 1;
        noteCanvas.width = Math.round(rect.width * ratio);
        noteCanvas.height = Math.round(rect.height * ratio);
        noteCanvasCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
        renderHandwritingCanvas();
      }

      function drawNoteStroke(stroke) {
        if (!stroke || stroke.points.length === 0) return;
        const rect = noteCanvas.getBoundingClientRect();
        noteCanvasCtx.save();
        noteCanvasCtx.strokeStyle = '#2f2a24';
        noteCanvasCtx.lineWidth = 2.4;
        noteCanvasCtx.lineCap = 'round';
        noteCanvasCtx.lineJoin = 'round';
        noteCanvasCtx.beginPath();
        const first = stroke.points[0];
        noteCanvasCtx.moveTo(first.x * rect.width, first.y * rect.height);
        if (stroke.points.length === 1) {
          noteCanvasCtx.arc(first.x * rect.width, first.y * rect.height, 1.2, 0, Math.PI * 2);
          noteCanvasCtx.fillStyle = '#2f2a24';
          noteCanvasCtx.fill();
        } else {
          stroke.points.slice(1).forEach((point) => noteCanvasCtx.lineTo(point.x * rect.width, point.y * rect.height));
          noteCanvasCtx.stroke();
        }
        noteCanvasCtx.restore();
      }

      function renderHandwritingCanvas() {
        const rect = noteCanvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        noteCanvasCtx.clearRect(0, 0, rect.width, rect.height);
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        if (!note || !Array.isArray(note.handwriting)) return;
        note.handwriting.forEach(drawNoteStroke);
        if (activePencilStroke) drawNoteStroke(activePencilStroke);
      }

      function pointFromNoteEvent(event) {
        const rect = noteCanvas.getBoundingClientRect();
        return {
          x: Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width)),
          y: Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height))
        };
      }

      function beginPencilWriting(event) {
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        if (!note || selectedNoteMode !== 'pencil') return;
        if (event.pointerType === 'mouse' && event.button !== undefined && event.button !== 0) return;
        event.preventDefault();
        noteCanvas.setPointerCapture(event.pointerId);
        activeWritingPointerId = event.pointerId;
        activePencilStroke = { points: [pointFromNoteEvent(event)] };
        renderHandwritingCanvas();
      }

      function continuePencilWriting(event) {
        if (!activePencilStroke) return;
        event.preventDefault();
        activePencilStroke.points.push(pointFromNoteEvent(event));
        renderHandwritingCanvas();
      }

      function finishPencilWriting(event) {
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        if (!note || !activePencilStroke) return;
        event.preventDefault();
        releasePointerCapture(noteCanvas, event.pointerId ?? activeWritingPointerId);
        activeWritingPointerId = null;
        if (!Array.isArray(note.handwriting)) note.handwriting = [];
        note.handwriting.push(activePencilStroke);
        activePencilStroke = null;
        renderHandwritingCanvas();
        scheduleSave();
      }

      function setSelectedNoteMode(mode) {
        selectedNoteMode = mode === 'pencil' ? 'pencil' : 'text';
        textModeButton.classList.toggle('active', selectedNoteMode === 'text');
        pencilModeButton.classList.toggle('active', selectedNoteMode === 'pencil');
        noteContentTextarea.hidden = selectedNoteMode === 'pencil';
        handwritingPanel.hidden = selectedNoteMode !== 'pencil';
        if (selectedNoteMode === 'pencil') {
          setTimeout(configureNoteCanvas, 0);
        }
      }

      function clearSelectedNoteHandwriting() {
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        if (!note) return;
        note.handwriting = [];
        renderHandwritingCanvas();
        scheduleSave();
      }

      function renderNotes() {
        noteLayer.innerHTML = '';
        noteLayer.hidden = !interactiveNotes.length;
        interactiveNotes.forEach((note, index) => {
          const marker = document.createElement('button');
          marker.type = 'button';
          marker.className = `note-marker${selectedNoteId === note.id ? ' selected' : ''}`;
          marker.style.left = `${note.x * 100}%`;
          marker.style.top = `${note.y * 100}%`;
          marker.textContent = String(index + 1);
          marker.addEventListener('click', (event) => {
            event.stopPropagation();
            selectNote(note.id);
          });
          marker.addEventListener('pointerdown', (event) => {
            if (activeTool !== 'notes') return;
            if (event.button !== undefined && event.button !== 0) return;
            event.preventDefault();
            event.stopPropagation();
            selectNote(note.id);
            draggingNoteId = note.id;
            isDraggingNote = true;
            window.addEventListener('pointermove', handleNoteDrag);
            window.addEventListener('pointerup', stopNoteDrag, { once: true });
          });
          noteLayer.appendChild(marker);
        });
      }

      function selectNote(noteId) {
        selectedNoteId = noteId;
        renderNotes();
        renderNoteList();
        syncSelectedNoteForm();
        setControls();
      }

      function addNote() {
        const newNote = {
          id: createNoteId(),
          title: `Notă ${interactiveNotes.length + 1}`,
          content: '',
          handwriting: [],
          inputMode: 'text',
          x: 0.5,
          y: 0.5
        };
        interactiveNotes.push(newNote);
        selectNote(newNote.id);
        scheduleSave();
      }

      function deleteSelectedNote() {
        if (!selectedNoteId) return;
        interactiveNotes = interactiveNotes.filter((note) => note.id !== selectedNoteId);
        selectedNoteId = interactiveNotes[0] ? interactiveNotes[0].id : null;
        renderNotes();
        renderNoteList();
        syncSelectedNoteForm();
        setControls();
        scheduleSave();
      }

      function handleNoteDrag(event) {
        if (!draggingNoteId) return;
        const note = interactiveNotes.find((item) => item.id === draggingNoteId);
        if (!note) return;
        const rect = stage.getBoundingClientRect();
        const x = clamp((event.clientX - rect.left) / rect.width, 0, 1);
        const y = clamp((event.clientY - rect.top) / rect.height, 0, 1);
        note.x = x;
        note.y = y;
        renderNotes();
        scheduleSave();
      }

      function stopNoteDrag() {
        draggingNoteId = null;
        isDraggingNote = false;
        window.removeEventListener('pointermove', handleNoteDrag);
      }

      function releasePointerCapture(target, pointerId) {
        if (!target || pointerId === null || pointerId === undefined) return;
        try {
          if (target.hasPointerCapture(pointerId)) {
            target.releasePointerCapture(pointerId);
          }
        } catch (error) {
          console.warn('Pointer capture could not be released.', error);
        }
      }

      function resetInteractionState() {
        activeStroke = null;
        activePencilStroke = null;
        draggingNoteId = null;
        isDrawing = false;
        isDraggingNote = false;
        isPanning = false;
        panning = false;
        panStart = null;
        panOrigin = null;
        activeTouches.clear();
        pinchStartDistance = 0;
        pinchStartZoom = zoomLevel;
        pinchCenter = null;
        releasePointerCapture(canvas, activeDrawingPointerId);
        releasePointerCapture(noteCanvas, activeWritingPointerId);
        activeDrawingPointerId = null;
        activeWritingPointerId = null;
        window.removeEventListener('pointermove', handleNoteDrag);
        window.removeEventListener('pointerup', stopNoteDrag);
        redraw();
        renderHandwritingCanvas();
        updateImageTransform();
      }

      function attachFullscreenInputHandlers() {
        detachFullscreenInputHandlers();
        fullscreenAbortController = new AbortController();
        const { signal } = fullscreenAbortController;
        stage.addEventListener('pointerdown', handleStagePointerDown, { passive: false, signal });
        stage.addEventListener('wheel', handleImageWheel, { passive: false, signal });
        window.addEventListener('pointermove', handleStagePointerMove, { signal });
        window.addEventListener('pointerup', handleStagePointerUp, { signal });
        window.addEventListener('pointercancel', handleStagePointerUp, { signal });
        window.addEventListener('blur', () => resetInteractionState(), { signal });
        window.addEventListener('resize', () => {
          if (fullscreenMode) {
            updateFullscreenFrame();
          }
          configureCanvas();
          configureNoteCanvas();
        }, { signal });
      }

      function detachFullscreenInputHandlers() {
        if (fullscreenAbortController) {
          fullscreenAbortController.abort();
          fullscreenAbortController = null;
        }
      }

      function setFullscreenMode(enabled) {
        fullscreenMode = enabled;
        document.body.classList.toggle('fullscreen-mode', enabled);
        fullscreenButton.hidden = enabled;
        exitFullscreenButton.hidden = !enabled;
        if (enabled) {
          resetInteractionState();
          resetFullscreenLayoutStyles();
          if (overlay && !overlay.contains(imagePanel)) {
            overlay.appendChild(imagePanel);
          }
          overlay.hidden = false;
          overlay.classList.add('is-active');
          imagePanel.classList.add('fullscreen-panel');
          updateFullscreenFrame();
          zoomLevel = 1;
          panOffset = { x: 0, y: 0 };
          attachFullscreenInputHandlers();
        } else {
          resetInteractionState();
          detachFullscreenInputHandlers();
          resetFullscreenLayoutStyles();
          if (overlay && overlay.contains(imagePanel)) {
            overlay.removeChild(imagePanel);
          }
          if (layout && !layout.contains(imagePanel)) {
            layout.insertBefore(imagePanel, layout.firstChild);
          }
          overlay.classList.remove('is-active');
          overlay.hidden = true;
          imagePanel.classList.remove('fullscreen-panel');
        }
        requestAnimationFrame(() => {
          configureCanvas();
          configureNoteCanvas();
          updateImageTransform();
        });
        setControls();
      }

      function handleStagePointerDown(event) {
        if (!sourceImage) return;
        if (event.target === canvas) return;
        if (event.pointerType === 'touch') {
          activeTouches.set(event.pointerId, { x: event.clientX, y: event.clientY });
          if (activeTouches.size === 1 && fullscreenMode) {
            event.preventDefault();
            isPanning = true;
            panning = true;
            panStart = { x: event.clientX, y: event.clientY };
            panOrigin = { ...panOffset };
          } else if (activeTouches.size === 2) {
            const points = Array.from(activeTouches.values());
            pinchStartDistance = getPointerDistance(points[0], points[1]);
            pinchStartZoom = zoomLevel;
            pinchCenter = getPointerMidpoint(points[0], points[1]);
            isPanning = false;
            panning = false;
          }
          return;
        }
        if (!fullscreenMode && !event.altKey) return;
        event.preventDefault();
        isPanning = true;
        panning = true;
        panStart = { x: event.clientX, y: event.clientY };
        panOrigin = { ...panOffset };
      }

      function handleStagePointerMove(event) {
        if (!sourceImage) return;
        if (event.pointerType === 'touch' && activeTouches.has(event.pointerId)) {
          activeTouches.set(event.pointerId, { x: event.clientX, y: event.clientY });
          if (activeTouches.size === 2) {
            const points = Array.from(activeTouches.values());
            const distance = getPointerDistance(points[0], points[1]);
            if (pinchStartDistance > 0) {
              event.preventDefault();
              const nextZoom = clamp(pinchStartZoom * (distance / pinchStartDistance), 0.6, 3);
              const center = getPointerMidpoint(points[0], points[1]);
              const zoomRatio = nextZoom / zoomLevel;
              panOffset.x = (panOffset.x - center.x) * zoomRatio + center.x;
              panOffset.y = (panOffset.y - center.y) * zoomRatio + center.y;
              zoomLevel = nextZoom;
              updateImageTransform();
              scheduleSave();
            }
            return;
          }
          if (!isPanning && !panning) return;
          event.preventDefault();
          panOffset.x = panOrigin.x + (event.clientX - panStart.x);
          panOffset.y = panOrigin.y + (event.clientY - panStart.y);
          updateImageTransform();
          scheduleSave();
          return;
        }
        if (!isPanning && !panning) return;
        event.preventDefault();
        panOffset.x = panOrigin.x + (event.clientX - panStart.x);
        panOffset.y = panOrigin.y + (event.clientY - panStart.y);
        updateImageTransform();
        scheduleSave();
      }

      function handleStagePointerUp(event) {
        if (event.pointerType === 'touch') {
          activeTouches.delete(event.pointerId);
          if (activeTouches.size < 2) {
            pinchStartDistance = 0;
            pinchStartZoom = zoomLevel;
            pinchCenter = null;
          }
        }
        if (!isPanning && !panning) return;
        isPanning = false;
        panning = false;
        panStart = null;
        panOrigin = null;
      }

      function getPointerDistance(pointA, pointB) {
        return Math.hypot(pointB.x - pointA.x, pointB.y - pointA.y);
      }

      function getPointerMidpoint(pointA, pointB) {
        return { x: (pointA.x + pointB.x) / 2, y: (pointA.y + pointB.y) / 2 };
      }

      function handleImageWheel(event) {
        if (!sourceImage) return;
        event.preventDefault();
        const rect = stage.getBoundingClientRect();
        const pointerX = event.clientX - rect.left;
        const pointerY = event.clientY - rect.top;
        const baseX = (pointerX - panOffset.x) / zoomLevel;
        const baseY = (pointerY - panOffset.y) / zoomLevel;
        const scaleFactor = event.deltaY < 0 ? 1.08 : 0.92;
        const nextZoom = clamp(zoomLevel * scaleFactor, 0.6, 3);
        panOffset.x = pointerX - baseX * nextZoom;
        panOffset.y = pointerY - baseY * nextZoom;
        zoomLevel = nextZoom;
        updateImageTransform();
        scheduleSave();
      }

      function resetCurrentProject({ persist = true } = {}) {
        if (currentObjectUrl) {
          URL.revokeObjectURL(currentObjectUrl);
        }
        if (photo.src && photo.src.startsWith('blob:')) {
          photo.removeAttribute('src');
        }
        sourceImage = null;
        imageBlob = null;
        currentObjectUrl = null;
        activeStroke = null;
        activePencilStroke = null;
        strokes = [];
        interactiveNotes = [];
        selectedNoteId = null;
        draggingNoteId = null;
        isDrawing = false;
        isDraggingNote = false;
        isPanning = false;
        activeDrawingPointerId = null;
        activeWritingPointerId = null;
        activeTool = 'draw';
        selectedNoteMode = 'text';
        zoomLevel = 1;
        panOffset = { x: 0, y: 0 };
        panning = false;
        panStart = null;
        panOrigin = null;
        activeTouches.clear();
        noteTitleInput.value = '';
        noteContentTextarea.value = '';
        noteTitleInput.hidden = false;
        noteContentTextarea.hidden = false;
        handwritingPanel.hidden = true;
        textModeButton.classList.add('active');
        pencilModeButton.classList.remove('active');
        noteList.innerHTML = '';
        noteLayer.innerHTML = '';
        noteLayer.hidden = true;
        emptyState.hidden = false;
        stage.hidden = true;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        noteCanvasCtx.clearRect(0, 0, noteCanvas.width, noteCanvas.height);
        updateImageTransform();
        setActiveTool('draw');
        setSelectedNoteMode('text');
        setControls();
        imageInput.value = '';
        projectInput.value = '';
        if (persist) {
          saveLastWork();
        }
      }

      function confirmRemoveImage() {
        if (!sourceImage) return;
        const confirmed = window.confirm('Sigur dorești să ștergi imaginea? Toate notițele, marcatorii și desenele asociate vor fi șterse.');
        if (!confirmed) return;
        resetCurrentProject();
      }

      function loadImage(file, { storedStrokes = [], storedNotes = [], shouldPersist = true } = {}) {
        return new Promise((resolve) => {
          if (!file || !file.type.startsWith('image/')) {
            resolve();
            return;
          }
          if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
          currentObjectUrl = URL.createObjectURL(file);
          photo.onload = async () => {
            sourceImage = photo;
            imageBlob = file;
            strokes = storedStrokes;
            interactiveNotes = storedNotes;
            selectedNoteId = interactiveNotes[0] ? interactiveNotes[0].id : null;
            emptyState.hidden = true;
            stage.hidden = false;
            noteLayer.hidden = !interactiveNotes.length;
            configureCanvas();
            renderNotes();
            renderNoteList();
            syncSelectedNoteForm();
            setControls();
            if (shouldPersist) {
              await saveLastWork();
            }
            resolve();
          };
          photo.src = currentObjectUrl;
          imageInput.value = '';
          projectInput.value = '';
        });
      }

      function clearDrawings() {
        activeStroke = null;
        strokes = [];
        redraw();
        setControls();
        saveLastWork();
      }

      function undoLastLine() {
        strokes.pop();
        redraw();
        setControls();
        saveLastWork();
      }

      async function saveProject() {
        if (!sourceImage) return;
        const project = await buildProjectPayload();
        const blob = new Blob([JSON.stringify(project, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = 'fisa-proiect.json';
        link.href = url;
        link.click();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        await saveLastWork(project);
      }

      async function loadProjectFromFile(file) {
        if (!file || file.type !== 'application/json' && !file.name.toLowerCase().endsWith('.json')) return;
        try {
          const text = await file.text();
          const project = JSON.parse(text);
          await restoreProject(project);
        } catch (error) {
          console.warn('Proiectul nu a putut fi încărcat.', error);
        }
      }

      addImage.addEventListener('click', (event) => {
        event.preventDefault();
        imageInput.click();
      });
      fullscreenButton.addEventListener('click', () => setFullscreenMode(true));
      exitFullscreenButton.addEventListener('click', () => setFullscreenMode(false));
      removeImageButton.addEventListener('click', confirmRemoveImage);
      loadProjectButton.addEventListener('click', (event) => {
        event.preventDefault();
        projectInput.click();
      });
      imageInput.addEventListener('change', (event) => loadImage(event.target.files[0]));
      projectInput.addEventListener('change', async (event) => {
        const [file] = event.target.files || [];
        if (file) {
          await loadProjectFromFile(file);
        }
      });
      drawModeButton.addEventListener('click', () => setActiveTool('draw'));
      notesModeButton.addEventListener('click', () => setActiveTool('notes'));
      undo.addEventListener('click', undoLastLine);
      clear.addEventListener('click', clearDrawings);
      save.addEventListener('click', saveProject);
      addNoteButton.addEventListener('click', addNote);
      deleteSelectedNoteButton.addEventListener('click', deleteSelectedNote);
      noteTitleInput.addEventListener('input', () => {
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        if (!note) return;
        note.title = noteTitleInput.value;
        renderNoteList();
        renderNotes();
        scheduleSave();
      });
      noteContentTextarea.addEventListener('input', () => {
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        if (!note) return;
        note.content = noteContentTextarea.value;
        renderNoteList();
        scheduleSave();
      });
      textModeButton.addEventListener('click', () => {
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        if (!note) return;
        note.inputMode = 'text';
        setSelectedNoteMode('text');
        scheduleSave();
      });
      pencilModeButton.addEventListener('click', () => {
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        if (!note) return;
        note.inputMode = 'pencil';
        setSelectedNoteMode('pencil');
        scheduleSave();
      });
      clearPencilInputButton.addEventListener('click', clearSelectedNoteHandwriting);
      noteCanvas.addEventListener('pointerdown', beginPencilWriting, { passive: false });
      noteCanvas.addEventListener('pointermove', continuePencilWriting, { passive: false });
      noteCanvas.addEventListener('pointerup', finishPencilWriting, { passive: false });
      noteCanvas.addEventListener('pointercancel', finishPencilWriting, { passive: false });
      canvas.addEventListener('pointerdown', beginDrawing, { passive: false });
      canvas.addEventListener('pointermove', continueDrawing, { passive: false });
      canvas.addEventListener('pointerup', finishDrawing, { passive: false });
      canvas.addEventListener('pointercancel', finishDrawing, { passive: false });
      canvas.addEventListener('gesturestart', (event) => event.preventDefault(), { passive: false });
      setActiveTool('draw');
      updateImageTransform();
      restoreLastWork();
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((registration) => {
            registration.update();
            registration.addEventListener('updatefound', () => {
              const installingWorker = registration.installing;
              if (!installingWorker) return;
              installingWorker.addEventListener('statechange', () => {
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  window.location.reload();
                }
              });
            });
          }).catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
