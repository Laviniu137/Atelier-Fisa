    .fullscreen-close-btn {

      gap: 12px;

      color: var(--panel-text);

      backdrop-filter: blur(20px) saturate(150%);

  <script>
    (() => {
      const addImage = document.getElementById('addImage');
      const removeImageButton = document.getElementById('removeImage');
      const imageInput = document.getElementById('imageInput');
      const loadProjectButton = document.getElementById('loadProject');
      const projectInput = document.getElementById('projectInput');
      const saveProjectDialog = document.getElementById('saveProjectDialog');
      const projectNameInput = document.getElementById('projectNameInput');
      const cancelProjectSaveButton = document.getElementById('cancelProjectSave');
      const confirmProjectSaveButton = document.getElementById('confirmProjectSave');
      const photo = document.getElementById('photo');
      const canvas = document.getElementById('drawingCanvas');
      const stage = document.getElementById('imageStage');
      const noteLayer = document.getElementById('noteLayer');
      const emptyState = document.getElementById('emptyState');
      const undo = document.getElementById('undo');
      const clear = document.getElementById('clear');
      const save = document.getElementById('save');
      const drawModeButton = document.getElementById('drawModeBtn');
      const notesModeButton = document.getElementById('notesModeBtn');
      const fullscreenButton = document.getElementById('fullscreenBtn');
      const fullscreenCloseButton = document.getElementById('fullscreenCloseButton');
      const fullscreenDrawingToolbar = document.getElementById('fullscreenDrawingToolbar');
      const fullscreenColorPicker = document.getElementById('fullscreenColorPicker');
      const fullscreenBrushSize = document.getElementById('fullscreenBrushSize');
      const fullscreenBrushSizeValue = document.getElementById('fullscreenBrushSizeValue');
      const fullscreenEraserBtn = document.getElementById('fullscreenEraserBtn');
      const fullscreenUndoBtn = document.getElementById('fullscreenUndoBtn');
      const fullscreenRedoBtn = document.getElementById('fullscreenRedoBtn');
      const fullscreenClearBtn = document.getElementById('fullscreenClearBtn');
      const fullscreenCloseToolbarBtn = document.getElementById('fullscreenCloseToolbarBtn');
      const thumbnailStrip = document.getElementById('thumbnailStrip');
      const thumbnailAddImageButton = document.getElementById('thumbnailAddImage');
      const addNoteButton = document.getElementById('addNote');
      const deleteSelectedNoteButton = document.getElementById('deleteSelectedNote');
      const noteList = document.getElementById('noteList');
      const noteContentTextarea = document.getElementById('noteContent');
      const textModeButton = document.getElementById('textModeBtn');
      const pencilModeButton = document.getElementById('pencilModeBtn');
      const handwritingPanel = document.getElementById('handwritingPanel');
      const noteCanvas = document.getElementById('noteCanvas');
      const clearPencilInputButton = document.getElementById('clearPencilInput');
      const fullscreenOverlay = document.getElementById('fullscreenOverlay');
      const overlay = fullscreenOverlay;
      const layout = document.querySelector('.layout');
      const imagePanel = document.querySelector('.image-panel');
      const noteCanvasCtx = noteCanvas.getContext('2d');
      const ctx = canvas.getContext('2d');
      let strokes = [];
      let activeStroke = null;
      let sourceImage = null;
      let currentObjectUrl = null;
      let imageBlob = null;
      let saveTimer = null;
      let projectImages = [];
      let activeImageIndex = 0;
      let currentProjectName = 'Proiect nou';
      let interactiveNotes = [];
      let selectedNoteId = null;
      let draggingNoteId = null;
      let activeTool = 'draw';
      let previousFullscreenTool = 'draw';
      let selectedNoteMode = 'text';
      let brushColor = '#000000';
      let brushSize = 4;
      let isErasing = false;
      let redoStack = [];
      let activePencilStroke = null;
      let zoomLevel = 1;
      let panOffset = { x: 0, y: 0 };
      let panning = false;
      let panStart = null;
      let panOrigin = null;
      let fullscreenMode = false;
      let fullscreenFrame = { width: 0, height: 0 };
      let fullscreenAbortController = null;
      let activeDrawingPointerId = null;
      let activeWritingPointerId = null;
      let isDrawing = false;
      let isDraggingNote = false;
      let isPanning = false;
      let activeTouches = new Map();
      let pinchStartDistance = 0;
      let pinchStartZoom = 1;
      let pinchCenter = null;
      let lastTapTime = 0;
      let lastTapPoint = null;
      const databaseName = 'fisa-atelier-offline';
      const databaseStore = 'lucrari';
      const projectVersion = 2;

      function openDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(databaseName, 1);
          request.onupgradeneeded = () => request.result.createObjectStore(databaseStore);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      function blobToDataUrl(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(blob);
        });
      }

      function cloneProjectData(value) {
        if (Array.isArray(value)) {
          return value.map((item) => cloneProjectData(item));
        }
        if (value && typeof value === 'object') {
          const clone = {};
          Object.keys(value).forEach((key) => {
            clone[key] = cloneProjectData(value[key]);
          });
          return clone;
        }
        return value;
      }

      function cloneProjectImageState(image = {}) {
        const source = image && typeof image === 'object' ? image : {};
        const drawSettings = source.drawSettings && typeof source.drawSettings === 'object' ? source.drawSettings : {};
        const colorValue = typeof drawSettings.color === 'string' && drawSettings.color ? drawSettings.color : '#000000';
        const sizeValue = Number(drawSettings.size);
        return {
          id: source.id || createNoteId(),
          name: source.name || '',
          dataUrl: source.dataUrl || '',
          type: source.type || 'image/png',
          strokes: cloneProjectData(Array.isArray(source.strokes) ? source.strokes : []),
          notes: cloneProjectData(Array.isArray(source.notes) ? source.notes : []),
          zoom: typeof source.zoom === 'number' ? source.zoom : 1,
          pan: source.pan && typeof source.pan.x === 'number' && typeof source.pan.y === 'number'
            ? { x: source.pan.x, y: source.pan.y }
            : { x: 0, y: 0 },
          activeTool: source.activeTool === 'notes' ? 'notes' : 'draw',
          selectedNoteId: source.selectedNoteId || null,
          selectedNoteMode: source.selectedNoteMode === 'pencil' ? 'pencil' : 'text',
          drawSettings: {
            color: colorValue,
            size: Number.isFinite(sizeValue) ? clamp(sizeValue, 1, 20) : 4,
            eraser: Boolean(drawSettings.eraser)
          }
        };
      }

      function dataUrlToFile(dataUrl, name = 'imagine.png') {
        return fetch(dataUrl)
          .then((response) => response.blob())
          .then((blob) => new File([blob], name, { type: blob.type || 'image/png' }));
      }

      function normalizeProjectName(value) {
        const text = String(value ?? '').replace(/\.json$/i, '').trim();
        return text || 'Proiect nou';
      }

      function isIPadOSDevice() {
        const userAgent = navigator.userAgent || '';
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        return isIOS && /Safari/.test(userAgent) && !/CriOS|FxiOS|OPiOS/.test(userAgent);
      }

      function getProjectFileName(value = currentProjectName) {
        const baseName = normalizeProjectName(value);
        return `${baseName}.json`;
      }

      function setProjectName(name) {
        currentProjectName = normalizeProjectName(name);
        document.title = `${currentProjectName} | Notițe interactive pe imagine`;
        return currentProjectName;
      }

      function getProjectImageName(index) {
        return `Imagine ${index + 1}`;
      }

      async function saveCurrentImageState() {
        const beforeSave = cloneProjectImageState(projectImages[activeImageIndex] || {});
        console.log('[debug] saveCurrentImageState: before save', {
          activeImageIndex,
          projectImagesLength: projectImages.length,
          currentState: beforeSave,
          strokesCount: strokes.length,
          notesCount: interactiveNotes.length,
          zoomLevel,
          panOffset,
          activeTool,
          selectedNoteId
        });

        const currentState = projectImages[activeImageIndex] || {};
        const activeImage = cloneProjectImageState({
          ...currentState,
          name: currentState.name || getProjectImageName(activeImageIndex),
          dataUrl: currentState.dataUrl || '',
          type: currentState.type || imageBlob?.type || 'image/png',
          strokes: cloneProjectData(Array.isArray(strokes) ? strokes : []),
          notes: cloneProjectData(Array.isArray(interactiveNotes) ? interactiveNotes : []),
          zoom: typeof zoomLevel === 'number' ? zoomLevel : 1,
          pan: panOffset && typeof panOffset.x === 'number' && typeof panOffset.y === 'number'
            ? { x: panOffset.x, y: panOffset.y }
            : { x: 0, y: 0 },
          activeTool: activeTool === 'notes' ? 'notes' : 'draw',
          selectedNoteId: selectedNoteId,
          selectedNoteMode: selectedNoteMode === 'pencil' ? 'pencil' : 'text'
        });

        if (!activeImage.dataUrl) {
          if (imageBlob) {
            activeImage.dataUrl = await blobToDataUrl(imageBlob);
          } else if (currentObjectUrl && currentObjectUrl.startsWith('blob:')) {
            const response = await fetch(currentObjectUrl);
            const blob = await response.blob();
            activeImage.dataUrl = await blobToDataUrl(blob);
          }
        }

        activeImage.name = activeImage.name || getProjectImageName(activeImageIndex);
        projectImages[activeImageIndex] = activeImage;

        console.log('[debug] saveCurrentImageState: after save', {
          activeImageIndex,
          savedImage: cloneProjectImageState(projectImages[activeImageIndex] || {}),
          projectImagesPreview: projectImages.map((image, index) => ({
            index,
            name: image?.name,
            strokesCount: Array.isArray(image?.strokes) ? image.strokes.length : 0,
            notesCount: Array.isArray(image?.notes) ? image.notes.length : 0,
            zoom: image?.zoom,
            pan: image?.pan
          }))
        });
      }

      async function buildProjectPayload() {
        await saveCurrentImageState();
        const payload = {
          version: projectVersion,
          updatedAt: new Date().toISOString(),
          projectName: currentProjectName,
          images: await Promise.all(projectImages.map(async (image, index) => {
            const imageRecord = cloneProjectImageState(image);
            let dataUrl = imageRecord.dataUrl || '';
            if (dataUrl && !dataUrl.startsWith('data:')) {
              try {
                const response = await fetch(dataUrl);
                const blob = await response.blob();
                dataUrl = await blobToDataUrl(blob);
              } catch (error) {
                dataUrl = '';
              }
            }
            return {
              id: imageRecord.id || createNoteId(),
              name: imageRecord.name || getProjectImageName(index),
              type: imageRecord.type || 'image/png',
              dataUrl,
              strokes: cloneProjectData(imageRecord.strokes),
              notes: cloneProjectData(imageRecord.notes),
              zoom: typeof imageRecord.zoom === 'number' ? imageRecord.zoom : 1,
              pan: imageRecord.pan && typeof imageRecord.pan.x === 'number' && typeof imageRecord.pan.y === 'number' ? { x: imageRecord.pan.x, y: imageRecord.pan.y } : { x: 0, y: 0 },
              activeTool: imageRecord.activeTool === 'notes' ? 'notes' : 'draw',
              selectedNoteId: imageRecord.selectedNoteId || null,
              selectedNoteMode: imageRecord.selectedNoteMode === 'pencil' ? 'pencil' : 'text',
              drawSettings: {
                color: imageRecord.drawSettings && typeof imageRecord.drawSettings.color === 'string' ? imageRecord.drawSettings.color : brushColor,
                size: Number.isFinite(Number(imageRecord.drawSettings && imageRecord.drawSettings.size)) ? clamp(Number(imageRecord.drawSettings.size), 1, 20) : brushSize,
                eraser: Boolean(imageRecord.drawSettings && imageRecord.drawSettings.eraser)
              }
            };
          }))
        };

        console.log('[debug] buildProjectPayload: payload before export', {
          projectName: payload.projectName,
          imagesCount: payload.images.length,
          firstImage: payload.images[0],
          allImages: payload.images.map((image, index) => ({
            index,
            name: image?.name,
            strokesCount: Array.isArray(image?.strokes) ? image.strokes.length : 0,
            notesCount: Array.isArray(image?.notes) ? image.notes.length : 0,
            zoom: image?.zoom,
            pan: image?.pan
          }))
        });

        return payload;
      }

      async function saveLastWork(projectOverride = null) {
        try {
          const database = await openDatabase();
          const transaction = database.transaction(databaseStore, 'readwrite');
          const payload = projectOverride || await buildProjectPayload();
          transaction.objectStore(databaseStore).put(payload, 'ultima-lucrare');
          transaction.oncomplete = () => database.close();
        } catch (error) {
          console.warn('Lucrarea nu a putut fi salvată local.', error);
        }
      }

      function scheduleSave() {
        window.clearTimeout(saveTimer);
        saveTimer = window.setTimeout(() => saveLastWork(), 350);
      }

      function resetFullscreenLayoutStyles() {
        const shell = document.getElementById('canvasShell');
        if (shell) {
          shell.style.width = '';
          shell.style.height = '';
        }
        if (stage) {
          stage.style.width = '';
          stage.style.height = '';
          stage.style.transform = '';
          stage.style.transformOrigin = '';
        }
      }

      function updateFullscreenFrame() {
        if (!fullscreenMode) return;
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        fullscreenFrame = { width: viewportWidth, height: viewportHeight };
        const shell = document.getElementById('canvasShell');
        if (shell) {
          shell.style.width = `${viewportWidth}px`;
          shell.style.height = `${viewportHeight}px`;
        }
        if (stage) {
          stage.style.width = `${viewportWidth}px`;
          stage.style.height = `${viewportHeight}px`;
        }
      }

      function updateImageTransform() {
        if (!sourceImage) {
          stage.style.transform = '';
          stage.style.transformOrigin = '0 0';
          return;
        }
        if (!fullscreenMode) {
          stage.style.transform = '';
          stage.style.transformOrigin = '0 0';
          return;
        }
        stage.style.transform = `translate(${panOffset.x}px, ${panOffset.y}px) scale(${zoomLevel})`;
        stage.style.transformOrigin = '0 0';
      }

      async function applyProjectState(project) {
        if (!project) return;
        if (project.projectName || project.name) {
          setProjectName(project.projectName || project.name);
        }

        const sourceImages = Array.isArray(project.images) && project.images.length
          ? project.images
          : (project.image?.dataUrl ? [{
              id: createNoteId(),
              name: project.image.name || 'Imagine 1',
              dataUrl: project.image.dataUrl,
              type: project.image.type || 'image/png',
              strokes: Array.isArray(project.drawing?.strokes) ? project.drawing.strokes : [],
              notes: Array.isArray(project.notes) ? project.notes : [],
              zoom: typeof project.ui?.zoom === 'number' ? project.ui.zoom : 1,
              pan: project.ui?.pan && typeof project.ui.pan.x === 'number' && typeof project.ui.pan.y === 'number' ? { x: project.ui.pan.x, y: project.ui.pan.y } : { x: 0, y: 0 },
              activeTool: project.ui?.activeTool === 'notes' ? 'notes' : 'draw',
              selectedNoteId: project.ui?.selectedNoteId || null,
              selectedNoteMode: project.ui?.selectedNoteMode === 'pencil' ? 'pencil' : 'text'
            }] : []);

        console.log('[debug] applyProjectState: source images', sourceImages);

        projectImages = sourceImages.map((image, index) => cloneProjectImageState({
          id: image.id || createNoteId(),
          name: image.name || getProjectImageName(index),
          dataUrl: image.dataUrl || '',
          type: image.type || 'image/png',
          strokes: Array.isArray(image.strokes) ? image.strokes : [],
          notes: Array.isArray(image.notes) ? image.notes : [],
          zoom: typeof image.zoom === 'number' ? image.zoom : 1,
          pan: image.pan && typeof image.pan.x === 'number' && typeof image.pan.y === 'number' ? { x: image.pan.x, y: image.pan.y } : { x: 0, y: 0 },
          activeTool: image.activeTool === 'notes' ? 'notes' : 'draw',
          selectedNoteId: image.selectedNoteId || null,
          selectedNoteMode: image.selectedNoteMode === 'pencil' ? 'pencil' : 'text',
          drawSettings: image.drawSettings && typeof image.drawSettings === 'object' ? image.drawSettings : {
            color: '#000000',
            size: 4,
            eraser: false
          }
        }));

        console.log('[debug] applyProjectState: projectImages after map', projectImages.map((image, index) => ({
          index,
          name: image?.name,
          strokesCount: Array.isArray(image?.strokes) ? image.strokes.length : 0,
          notesCount: Array.isArray(image?.notes) ? image.notes.length : 0,
          zoom: image?.zoom,
          pan: image?.pan
        })));

        if (!projectImages.length) {
          resetCurrentProject({ persist: false });
          return;
        }

        activeImageIndex = 0;
        await activateImageAt(0, { persist: false });
      }

      async function restoreProject(project) {
        if (!project) return;
        await applyProjectState(project);
      }

      async function restoreLastWork() {
        try {
          const database = await openDatabase();
          const transaction = database.transaction(databaseStore, 'readonly');
          const request = transaction.objectStore(databaseStore).get('ultima-lucrare');
          request.onsuccess = async () => {
            const work = request.result;
            database.close();
            if (!work) return;
            await restoreProject(work);
          };
          request.onerror = () => database.close();
        } catch (error) {
          console.warn('Lucrarea anterioară nu a putut fi restaurată.', error);
        }
      }

      function setControls() {
        const ready = Boolean(sourceImage);
        undo.disabled = !ready || strokes.length === 0 || activeTool !== 'draw';
        clear.disabled = !ready || strokes.length === 0 || activeTool !== 'draw';
        save.disabled = !ready;
        fullscreenButton.disabled = !ready;
        removeImageButton.disabled = !ready;
        addNoteButton.disabled = !ready || activeTool !== 'notes';
        deleteSelectedNoteButton.disabled = !ready || !selectedNoteId || activeTool !== 'notes';
      }

      function renderImageThumbnails() {
        if (!thumbnailStrip) return;
        thumbnailStrip.innerHTML = '';

        if (!projectImages.length) {
          const placeholder = document.createElement('div');
          placeholder.className = 'image-thumb';
          placeholder.innerHTML = '<img alt="" style="opacity:.2; object-fit:cover;" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22 viewBox=%220 0 80 80%22%3E%3Crect width=%2280%22 height=%2280%22 fill=%22%23efe7dc%22/%3E%3Cpath d=%22M20 50l12-12 10 10 18-22 12 20v14H20z%22 fill=%22%23d3c5b5%22/%3E%3C/svg%3E">';
          thumbnailStrip.appendChild(placeholder);
          return;
        }

        projectImages.forEach((image, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `image-thumb${index === activeImageIndex ? ' is-active' : ''}`;
          button.title = image.name || getProjectImageName(index);
          button.setAttribute('aria-label', image.name || getProjectImageName(index));
          button.addEventListener('click', () => {
            if (index === activeImageIndex) return;
            activateImageAt(index, { persist: true });
          });

          const preview = document.createElement('img');
          preview.alt = image.name || getProjectImageName(index);
          preview.src = image.dataUrl || '';
          if (!image.dataUrl) {
            preview.src = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22 viewBox=%220 0 80 80%22%3E%3Crect width=%2280%22 height=%2280%22 fill=%22%23efe7dc%22/%3E%3Cpath d=%22M20 50l12-12 10 10 18-22 12 20v14H20z%22 fill=%22%23d3c5b5%22/%3E%3C/svg%3E';
          }
          button.appendChild(preview);
          thumbnailStrip.appendChild(button);
        });
      }

      function setActiveTool(tool) {
        activeTool = tool;
        drawModeButton.classList.toggle('active', tool === 'draw');
        notesModeButton.classList.toggle('active', tool === 'notes');
        canvas.style.cursor = tool === 'draw' ? 'crosshair' : 'default';
        setControls();
      }

      function configureCanvas() {
        const rect = photo.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * ratio);
        canvas.height = Math.round(rect.height * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        redraw();
      }

      function drawStroke(stroke) {
        if (!stroke || stroke.points.length === 0) return;
        const rect = photo.getBoundingClientRect();
        const strokeColor = typeof stroke.color === 'string' ? stroke.color : brushColor;
        const strokeSize = typeof stroke.size === 'number' ? stroke.size : brushSize;
        const isErasingStroke = Boolean(stroke.eraser);
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = strokeSize;
        ctx.strokeStyle = isErasingStroke ? 'rgba(0,0,0,1)' : strokeColor;
        ctx.fillStyle = isErasingStroke ? 'rgba(0,0,0,1)' : strokeColor;
        ctx.globalCompositeOperation = isErasingStroke ? 'destination-out' : 'source-over';
        ctx.beginPath();
        const first = stroke.points[0];
        ctx.moveTo(first.x * rect.width, first.y * rect.height);
        if (stroke.points.length === 1) {
          ctx.arc(first.x * rect.width, first.y * rect.height, Math.max(1, strokeSize / 2), 0, Math.PI * 2);
          ctx.fill();
        } else {
          for (let index = 1; index < stroke.points.length; index += 1) {
            const point = stroke.points[index];
            ctx.lineTo(point.x * rect.width, point.y * rect.height);
          }
          ctx.stroke();
        }
        ctx.restore();
      }

      function redraw() {
        const rect = photo.getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);
        strokes.forEach(drawStroke);
        if (activeStroke) drawStroke(activeStroke);
      }

      function syncBrushControls() {
        if (fullscreenColorPicker) {
          fullscreenColorPicker.value = brushColor;
        }
        if (fullscreenBrushSize) {
          fullscreenBrushSize.value = String(brushSize);
        }
        if (fullscreenBrushSizeValue) {
          fullscreenBrushSizeValue.textContent = `${brushSize} px`;
        }
        if (fullscreenEraserBtn) {
          fullscreenEraserBtn.classList.toggle('active', isErasing);
        }
        document.querySelectorAll('.quick-color-button').forEach((button) => {
          const isActive = button.dataset.color && button.dataset.color.toLowerCase() === brushColor.toLowerCase();
          button.classList.toggle('is-selected', isActive);
        });
        if (fullscreenUndoBtn) {
          fullscreenUndoBtn.disabled = strokes.length === 0;
        }
        if (fullscreenRedoBtn) {
          fullscreenRedoBtn.disabled = redoStack.length === 0;
        }
      }

      function pointFromEvent(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width)),
          y: Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height))
        };
      }

      function beginDrawing(event) {
        if (!sourceImage || activeTool !== 'draw' || event.altKey) return;
        if (event.pointerType === 'mouse' && event.button !== undefined && event.button !== 0) return;
        event.preventDefault();
        canvas.setPointerCapture(event.pointerId);
        activeDrawingPointerId = event.pointerId;
        isDrawing = true;
        activeStroke = {
          points: [pointFromEvent(event)],
          color: brushColor,
          size: brushSize,
          eraser: isErasing
        };
        redraw();
      }

      function continueDrawing(event) {
        if (!activeStroke) return;
        event.preventDefault();
        activeStroke.points.push(pointFromEvent(event));
        redraw();
      }

      function finishDrawing(event) {
        if (!activeStroke) return;
        event.preventDefault();
        releasePointerCapture(canvas, event.pointerId ?? activeDrawingPointerId);
        activeDrawingPointerId = null;
        isDrawing = false;
        strokes.push(activeStroke);
        redoStack = [];
        activeStroke = null;
        redraw();
        setControls();
        syncBrushControls();
        saveLastWork();
      }

      function createNoteId() {
        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function renderNoteList() {
        noteList.innerHTML = '';
        if (!interactiveNotes.length) {
          const empty = document.createElement('div');
          empty.className = 'note-list-item';
          empty.innerHTML = '<strong>Nu există încă note</strong><small>Adaugă una pentru a marca zone importante pe imagine.</small>';
          noteList.appendChild(empty);
          return;
        }
        interactiveNotes.forEach((note) => {
          const item = document.createElement('div');
          item.className = `note-list-item${selectedNoteId === note.id ? ' selected' : ''}`;
          item.addEventListener('click', () => selectNote(note.id));

          const nameField = document.createElement('div');
          nameField.className = 'note-list-name';
          nameField.textContent = getNoteDisplayName(note);
          nameField.contentEditable = selectedNoteId === note.id;
          nameField.setAttribute('spellcheck', 'false');
          nameField.addEventListener('click', (event) => {
            event.stopPropagation();
            selectNote(note.id);
            if (selectedNoteId === note.id) {
              window.setTimeout(() => nameField.focus(), 0);
            }
          });
          nameField.addEventListener('input', () => {
            const value = nameField.textContent.replace(/\s+/g, ' ').trim();
            note.name = value || 'Notă nouă';
            scheduleSave();
          });
          nameField.addEventListener('blur', () => {
            const value = nameField.textContent.replace(/\s+/g, ' ').trim();
            note.name = value || 'Notă nouă';
            renderNoteList();
            scheduleSave();
          });

          item.appendChild(nameField);
          noteList.appendChild(item);
        });
      }

      function getNoteDisplayName(note) {
        const name = typeof note?.name === 'string' ? note.name.trim() : '';
        if (name) return name;
        return 'Notă nouă';
      }

      function syncSelectedNoteForm() {
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        noteContentTextarea.value = note ? note.content : '';
        setSelectedNoteMode(note && note.inputMode === 'pencil' ? 'pencil' : 'text');
        renderHandwritingCanvas();
      }

      function configureNoteCanvas() {
        const rect = noteCanvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        noteCanvas.width = Math.round(rect.width * ratio);
        noteCanvas.height = Math.round(rect.height * ratio);
        noteCanvasCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
        renderHandwritingCanvas();
      }

      function drawNoteStroke(stroke) {
        if (!stroke || stroke.points.length === 0) return;
        const rect = noteCanvas.getBoundingClientRect();
        noteCanvasCtx.save();
        noteCanvasCtx.strokeStyle = '#2f2a24';
        noteCanvasCtx.lineWidth = 2.4;
        noteCanvasCtx.lineCap = 'round';
        noteCanvasCtx.lineJoin = 'round';
        noteCanvasCtx.beginPath();
        const first = stroke.points[0];
        noteCanvasCtx.moveTo(first.x * rect.width, first.y * rect.height);
        if (stroke.points.length === 1) {
          noteCanvasCtx.arc(first.x * rect.width, first.y * rect.height, 1.2, 0, Math.PI * 2);
          noteCanvasCtx.fillStyle = '#2f2a24';
          noteCanvasCtx.fill();
        } else {
          stroke.points.slice(1).forEach((point) => noteCanvasCtx.lineTo(point.x * rect.width, point.y * rect.height));
          noteCanvasCtx.stroke();
        }
        noteCanvasCtx.restore();
      }

      function renderHandwritingCanvas() {
        const rect = noteCanvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        noteCanvasCtx.clearRect(0, 0, rect.width, rect.height);
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        if (!note || !Array.isArray(note.handwriting)) return;
        note.handwriting.forEach(drawNoteStroke);
        if (activePencilStroke) drawNoteStroke(activePencilStroke);
      }

      function pointFromNoteEvent(event) {
        const rect = noteCanvas.getBoundingClientRect();
        return {
          x: Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width)),
          y: Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height))
        };
      }

      function beginPencilWriting(event) {
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        if (!note || selectedNoteMode !== 'pencil') return;
        if (event.pointerType === 'mouse' && event.button !== undefined && event.button !== 0) return;
        event.preventDefault();
        noteCanvas.setPointerCapture(event.pointerId);
        activeWritingPointerId = event.pointerId;
        activePencilStroke = { points: [pointFromNoteEvent(event)] };
        renderHandwritingCanvas();
      }

      function continuePencilWriting(event) {
        if (!activePencilStroke) return;
        event.preventDefault();
        activePencilStroke.points.push(pointFromNoteEvent(event));
        renderHandwritingCanvas();
      }

      function finishPencilWriting(event) {
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        if (!note || !activePencilStroke) return;
        event.preventDefault();
        releasePointerCapture(noteCanvas, event.pointerId ?? activeWritingPointerId);
        activeWritingPointerId = null;
        if (!Array.isArray(note.handwriting)) note.handwriting = [];
        note.handwriting.push(activePencilStroke);
        activePencilStroke = null;
        renderHandwritingCanvas();
        scheduleSave();
      }

      function setSelectedNoteMode(mode) {
        selectedNoteMode = mode === 'pencil' ? 'pencil' : 'text';
        textModeButton.classList.toggle('active', selectedNoteMode === 'text');
        pencilModeButton.classList.toggle('active', selectedNoteMode === 'pencil');
        noteContentTextarea.hidden = selectedNoteMode === 'pencil';
        handwritingPanel.hidden = selectedNoteMode !== 'pencil';
        if (selectedNoteMode === 'pencil') {
          setTimeout(configureNoteCanvas, 0);
        }
      }

      function clearSelectedNoteHandwriting() {
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        if (!note) return;
        note.handwriting = [];
        renderHandwritingCanvas();
        scheduleSave();
      }

      function renderNotes() {
        noteLayer.innerHTML = '';
        noteLayer.hidden = !interactiveNotes.length;
        interactiveNotes.forEach((note, index) => {
          const marker = document.createElement('button');
          marker.type = 'button';
          marker.className = `note-marker${selectedNoteId === note.id ? ' selected' : ''}`;
          marker.style.left = `${note.x * 100}%`;
          marker.style.top = `${note.y * 100}%`;
          marker.textContent = String(index + 1);
          marker.addEventListener('click', (event) => {
            event.stopPropagation();
            selectNote(note.id);
          });
          marker.addEventListener('pointerdown', (event) => {
            if (activeTool !== 'notes') return;
            if (event.button !== undefined && event.button !== 0) return;
            event.preventDefault();
            event.stopPropagation();
            selectNote(note.id);
            draggingNoteId = note.id;
            isDraggingNote = true;
            window.addEventListener('pointermove', handleNoteDrag);
            window.addEventListener('pointerup', stopNoteDrag, { once: true });
          });
          noteLayer.appendChild(marker);
        });
      }

      function selectNote(noteId) {
        selectedNoteId = noteId;
        renderNotes();
        renderNoteList();
        syncSelectedNoteForm();
        setControls();
      }

      function addNote() {
        const newNote = {
          id: createNoteId(),
          name: '',
          content: '',
          handwriting: [],
          inputMode: 'text',
          x: 0.5,
          y: 0.5
        };
        interactiveNotes.push(newNote);
        selectNote(newNote.id);
        scheduleSave();
      }

      function deleteSelectedNote() {
        if (!selectedNoteId) return;
        interactiveNotes = interactiveNotes.filter((note) => note.id !== selectedNoteId);
        selectedNoteId = interactiveNotes[0] ? interactiveNotes[0].id : null;
        renderNotes();
        renderNoteList();
        syncSelectedNoteForm();
        setControls();
        scheduleSave();
      }

      function handleNoteDrag(event) {
        if (!draggingNoteId) return;
        const note = interactiveNotes.find((item) => item.id === draggingNoteId);
        if (!note) return;
        const rect = stage.getBoundingClientRect();
        const x = clamp((event.clientX - rect.left) / rect.width, 0, 1);
        const y = clamp((event.clientY - rect.top) / rect.height, 0, 1);
        note.x = x;
        note.y = y;
        renderNotes();
        scheduleSave();
      }

      function stopNoteDrag() {
        draggingNoteId = null;
        isDraggingNote = false;
        window.removeEventListener('pointermove', handleNoteDrag);
      }

      function releasePointerCapture(target, pointerId) {
        if (!target || pointerId === null || pointerId === undefined) return;
        try {
          if (target.hasPointerCapture(pointerId)) {
            target.releasePointerCapture(pointerId);
          }
        } catch (error) {
          console.warn('Pointer capture could not be released.', error);
        }
      }

      function resetInteractionState() {
        activeStroke = null;
        activePencilStroke = null;
        draggingNoteId = null;
        isDrawing = false;
        isDraggingNote = false;
        isPanning = false;
        panning = false;
        panStart = null;
        panOrigin = null;
        activeTouches.clear();
        pinchStartDistance = 0;
        pinchStartZoom = zoomLevel;
        pinchCenter = null;
        releasePointerCapture(canvas, activeDrawingPointerId);
        releasePointerCapture(noteCanvas, activeWritingPointerId);
        activeDrawingPointerId = null;
        activeWritingPointerId = null;
        window.removeEventListener('pointermove', handleNoteDrag);
        window.removeEventListener('pointerup', stopNoteDrag);
        redraw();
        renderHandwritingCanvas();
        updateImageTransform();
      }

      function attachFullscreenInputHandlers() {
        detachFullscreenInputHandlers();
        fullscreenAbortController = new AbortController();
        const { signal } = fullscreenAbortController;
        stage.addEventListener('pointerdown', handleStagePointerDown, { passive: false, signal });
        stage.addEventListener('wheel', handleImageWheel, { passive: false, signal });
        window.addEventListener('pointermove', handleStagePointerMove, { signal });
        window.addEventListener('pointerup', handleStagePointerUp, { signal });
        window.addEventListener('pointercancel', handleStagePointerUp, { signal });
        window.addEventListener('blur', () => resetInteractionState(), { signal });
        window.addEventListener('resize', () => {
          if (fullscreenMode) {
            updateFullscreenFrame();
          }
          configureCanvas();
          configureNoteCanvas();
        }, { signal });
      }

      function detachFullscreenInputHandlers() {
        if (fullscreenAbortController) {
          fullscreenAbortController.abort();
          fullscreenAbortController = null;
        }
      }

      function setFullscreenMode(enabled) {
        fullscreenMode = enabled;
        document.body.classList.toggle('fullscreen-mode', enabled);
        fullscreenButton.hidden = enabled;
        if (fullscreenCloseButton) {
          fullscreenCloseButton.hidden = !enabled;
        }
        if (fullscreenDrawingToolbar) {
          fullscreenDrawingToolbar.hidden = !enabled;
        }
        if (enabled) {
          previousFullscreenTool = activeTool;
          setActiveTool('draw');
          resetInteractionState();
          resetFullscreenLayoutStyles();
          if (overlay && !overlay.contains(imagePanel)) {
            overlay.appendChild(imagePanel);
          }
          overlay.hidden = false;
          overlay.classList.add('is-active');
          imagePanel.classList.add('fullscreen-panel');
          updateFullscreenFrame();
          zoomLevel = 1;
          panOffset = { x: 0, y: 0 };
          syncBrushControls();
          attachFullscreenInputHandlers();
        } else {
          resetInteractionState();
          detachFullscreenInputHandlers();
          resetFullscreenLayoutStyles();
          if (overlay && overlay.contains(imagePanel)) {
            overlay.removeChild(imagePanel);
          }
          if (layout && !layout.contains(imagePanel)) {
            layout.insertBefore(imagePanel, layout.firstChild);
          }
          overlay.classList.remove('is-active');
          overlay.hidden = true;
          imagePanel.classList.remove('fullscreen-panel');
          setActiveTool(previousFullscreenTool);
          if (fullscreenDrawingToolbar) {
            fullscreenDrawingToolbar.hidden = true;
          }
          if (fullscreenCloseButton) {
            fullscreenCloseButton.hidden = true;
          }
        }
        requestAnimationFrame(() => {
          configureCanvas();
          configureNoteCanvas();
          updateImageTransform();
        });
        setControls();
      }

      function resetZoomAndPan() {
        zoomLevel = 1;
        panOffset = { x: 0, y: 0 };
        updateImageTransform();
        scheduleSave();
      }

      function handleStagePointerDown(event) {
        if (!sourceImage) return;
        if (event.target === canvas) return;
        if (event.pointerType === 'touch') {
          const touchPoint = { x: event.clientX, y: event.clientY };
          activeTouches.set(event.pointerId, touchPoint);
          if (activeTouches.size === 1 && fullscreenMode) {
            const now = Date.now();
            const isDoubleTap = lastTapPoint && now - lastTapTime < 280 && Math.hypot(touchPoint.x - lastTapPoint.x, touchPoint.y - lastTapPoint.y) < 28;
            if (isDoubleTap) {
              lastTapTime = 0;
              lastTapPoint = null;
              resetZoomAndPan();
              return;
            }
            lastTapTime = now;
            lastTapPoint = touchPoint;
            event.preventDefault();
            isPanning = true;
            panning = true;
            panStart = { x: event.clientX, y: event.clientY };
            panOrigin = { ...panOffset };
          } else if (activeTouches.size === 2) {
            const points = Array.from(activeTouches.values());
            pinchStartDistance = getPointerDistance(points[0], points[1]);
            pinchStartZoom = zoomLevel;
            pinchCenter = getPointerMidpoint(points[0], points[1]);
            isPanning = false;
            panning = false;
          }
          return;
        }
        if (!fullscreenMode && !event.altKey) return;
        event.preventDefault();
        isPanning = true;
        panning = true;
        panStart = { x: event.clientX, y: event.clientY };
        panOrigin = { ...panOffset };
      }

      function handleStagePointerMove(event) {
        if (!sourceImage) return;
        if (event.pointerType === 'touch' && activeTouches.has(event.pointerId)) {
          activeTouches.set(event.pointerId, { x: event.clientX, y: event.clientY });
          if (activeTouches.size === 2) {
            const points = Array.from(activeTouches.values());
            const distance = getPointerDistance(points[0], points[1]);
            if (pinchStartDistance > 0) {
              event.preventDefault();
              const nextZoom = clamp(pinchStartZoom * (distance / pinchStartDistance), 0.6, 3);
              const center = getPointerMidpoint(points[0], points[1]);
              const zoomRatio = nextZoom / zoomLevel;
              panOffset.x = (panOffset.x - center.x) * zoomRatio + center.x;
              panOffset.y = (panOffset.y - center.y) * zoomRatio + center.y;
              zoomLevel = nextZoom;
              updateImageTransform();
              scheduleSave();
            }
            return;
          }
          if (!isPanning && !panning) return;
          event.preventDefault();
          panOffset.x = panOrigin.x + (event.clientX - panStart.x);
          panOffset.y = panOrigin.y + (event.clientY - panStart.y);
          updateImageTransform();
          scheduleSave();
          return;
        }
        if (!isPanning && !panning) return;
        event.preventDefault();
        panOffset.x = panOrigin.x + (event.clientX - panStart.x);
        panOffset.y = panOrigin.y + (event.clientY - panStart.y);
        updateImageTransform();
        scheduleSave();
      }

      function handleStagePointerUp(event) {
        if (event.pointerType === 'touch') {
          activeTouches.delete(event.pointerId);
          if (activeTouches.size < 2) {
            pinchStartDistance = 0;
            pinchStartZoom = zoomLevel;
            pinchCenter = null;
          }
        }
        if (!isPanning && !panning) return;
        isPanning = false;
        panning = false;
        panStart = null;
        panOrigin = null;
      }

      function getPointerDistance(pointA, pointB) {
        return Math.hypot(pointB.x - pointA.x, pointB.y - pointA.y);
      }

      function getPointerMidpoint(pointA, pointB) {
        return { x: (pointA.x + pointB.x) / 2, y: (pointA.y + pointB.y) / 2 };
      }

      function handleImageWheel(event) {
        if (!sourceImage) return;
        event.preventDefault();
        const rect = stage.getBoundingClientRect();
        const pointerX = event.clientX - rect.left;
        const pointerY = event.clientY - rect.top;
        const baseX = (pointerX - panOffset.x) / zoomLevel;
        const baseY = (pointerY - panOffset.y) / zoomLevel;
        const scaleFactor = event.deltaY < 0 ? 1.08 : 0.92;
        const nextZoom = clamp(zoomLevel * scaleFactor, 0.6, 3);
        panOffset.x = pointerX - baseX * nextZoom;
        panOffset.y = pointerY - baseY * nextZoom;
        zoomLevel = nextZoom;
        updateImageTransform();
        scheduleSave();
      }

      function resetCurrentProject({ persist = true } = {}) {
        if (currentObjectUrl && currentObjectUrl.startsWith('blob:')) {
          URL.revokeObjectURL(currentObjectUrl);
        }
        if (photo.src && photo.src.startsWith('blob:')) {
          photo.removeAttribute('src');
        }
        setProjectName('Proiect nou');
        sourceImage = null;
        imageBlob = null;
        currentObjectUrl = null;
        activeStroke = null;
        activePencilStroke = null;
        strokes = [];
        interactiveNotes = [];
        projectImages = [];
        activeImageIndex = 0;
        selectedNoteId = null;
        draggingNoteId = null;
        isDrawing = false;
        isDraggingNote = false;
        isPanning = false;
        activeDrawingPointerId = null;
        activeWritingPointerId = null;
        activeTool = 'draw';
        selectedNoteMode = 'text';
        redoStack = [];
        brushColor = '#000000';
        brushSize = 4;
        isErasing = false;
        zoomLevel = 1;
        panOffset = { x: 0, y: 0 };
        panning = false;
        panStart = null;
        panOrigin = null;
        activeTouches.clear();
        noteContentTextarea.value = '';
        noteContentTextarea.hidden = false;
        handwritingPanel.hidden = true;
        textModeButton.classList.add('active');
        pencilModeButton.classList.remove('active');
        noteList.innerHTML = '';
        noteLayer.innerHTML = '';
        noteLayer.hidden = true;
        emptyState.hidden = false;
        stage.hidden = true;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        noteCanvasCtx.clearRect(0, 0, noteCanvas.width, noteCanvas.height);
        syncBrushControls();
        renderImageThumbnails();
        updateImageTransform();
        setActiveTool('draw');
        setSelectedNoteMode('text');
        setControls();
        imageInput.value = '';
        projectInput.value = '';
        if (persist) {
          saveLastWork();
        }
      }

      function confirmRemoveImage() {
        if (!sourceImage) return;
        const confirmed = window.confirm('Sigur dorești să ștergi imaginea activă din proiect? Toate notițele, marcatorii și desenele asociate acestei imagini vor fi șterse.');
        if (!confirmed) return;
        if (projectImages.length > 1) {
          projectImages.splice(activeImageIndex, 1);
          activeImageIndex = clamp(activeImageIndex, 0, Math.max(projectImages.length - 1, 0));
          if (projectImages.length) {
            activateImageAt(activeImageIndex, { persist: true });
            return;
          }
        }
        resetCurrentProject();
      }

      function applyCurrentBrushSettings() {
        if (!sourceImage) return;
        const currentProjectImage = projectImages[activeImageIndex];
        if (!currentProjectImage) return;
        currentProjectImage.drawSettings = {
          color: brushColor,
          size: brushSize,
          eraser: isErasing
        };
      }

      async function activateImageAt(index, { persist = true } = {}) {
        if (!projectImages.length) {
          resetCurrentProject({ persist });
          return;
        }

        const previousIndex = activeImageIndex;
        const targetIndex = ((index % projectImages.length) + projectImages.length) % projectImages.length;

        if (sourceImage && projectImages[previousIndex] && previousIndex !== targetIndex) {
          console.log('[debug] activateImageAt: saving previous image before switch', {
            previousIndex,
            targetIndex,
            strokesCount: strokes.length,
            notesCount: interactiveNotes.length
          });
          await saveCurrentImageState();
        }

        activeImageIndex = targetIndex;
        const currentImage = projectImages[activeImageIndex];
        console.log('[debug] activateImageAt: selected image', {
          activeImageIndex,
          currentImage: currentImage ? {
            name: currentImage.name,
            strokesCount: Array.isArray(currentImage.strokes) ? currentImage.strokes.length : 0,
            notesCount: Array.isArray(currentImage.notes) ? currentImage.notes.length : 0,
            zoom: currentImage.zoom,
            pan: currentImage.pan
          } : null
        });
        if (!currentImage || !currentImage.dataUrl) {
          resetCurrentProject({ persist });
          return;
        }
        if (currentObjectUrl && currentObjectUrl.startsWith('blob:')) {
          URL.revokeObjectURL(currentObjectUrl);
        }
        const blob = await (await fetch(currentImage.dataUrl)).blob();
        currentObjectUrl = URL.createObjectURL(blob);
        photo.onload = () => {
          sourceImage = photo;
          imageBlob = blob;
          strokes = cloneProjectData(Array.isArray(currentImage.strokes) ? currentImage.strokes : []);
          interactiveNotes = cloneProjectData(Array.isArray(currentImage.notes) ? currentImage.notes : []);
          selectedNoteId = interactiveNotes.find((note) => note.id === currentImage.selectedNoteId)?.id || interactiveNotes[0]?.id || null;
          activeTool = currentImage.activeTool === 'notes' ? 'notes' : 'draw';
          selectedNoteMode = currentImage.selectedNoteMode === 'pencil' ? 'pencil' : 'text';
          const savedSettings = currentImage.drawSettings && typeof currentImage.drawSettings === 'object' ? currentImage.drawSettings : {};
          brushColor = typeof savedSettings.color === 'string' && savedSettings.color ? savedSettings.color : '#000000';
          brushSize = Number.isFinite(Number(savedSettings.size)) ? clamp(Number(savedSettings.size), 1, 20) : 4;
          isErasing = Boolean(savedSettings.eraser);
          redoStack = [];
          zoomLevel = typeof currentImage.zoom === 'number' ? currentImage.zoom : 1;
          panOffset = currentImage.pan && typeof currentImage.pan.x === 'number' && typeof currentImage.pan.y === 'number'
            ? { x: currentImage.pan.x, y: currentImage.pan.y }
            : { x: 0, y: 0 };
          emptyState.hidden = true;
          stage.hidden = false;
          noteLayer.hidden = !interactiveNotes.length;
          configureCanvas();
          renderNotes();
          renderNoteList();
          renderImageThumbnails();
          syncSelectedNoteForm();
          syncBrushControls();
          setActiveTool(activeTool);
          setSelectedNoteMode(selectedNoteMode);
          updateImageTransform();
          setControls();
          console.log('[debug] activateImageAt: after load image state', {
            activeImageIndex,
            strokesCount: strokes.length,
            notesCount: interactiveNotes.length,
            zoomLevel,
            panOffset,
            selectedNoteId,
            drawSettings: { color: brushColor, size: brushSize, eraser: isErasing }
          });
          if (persist) {
            saveLastWork();
          }
        };
        photo.src = currentObjectUrl;
        imageInput.value = '';
        projectInput.value = '';
      }

      function loadImage(file, { storedStrokes = [], storedNotes = [], shouldPersist = true } = {}) {
        return new Promise(async (resolve) => {
          if (!file || !file.type.startsWith('image/')) {
            resolve();
            return;
          }
          const dataUrl = await blobToDataUrl(file);
          const imageEntry = {
            id: createNoteId(),
            name: file.name || getProjectImageName(projectImages.length),
            dataUrl,
            type: file.type || 'image/png',
            strokes: cloneProjectData(storedStrokes),
            notes: cloneProjectData(storedNotes),
            zoom: 1,
            pan: { x: 0, y: 0 },
            activeTool: 'draw',
            selectedNoteId: null,
            selectedNoteMode: 'text',
            drawSettings: {
              color: brushColor,
              size: brushSize,
              eraser: isErasing
            }
          };
          console.log('[debug] loadImage: pushing new image entry', {
            imageEntry,
            projectImagesBefore: projectImages.length,
            activeImageIndexBefore: activeImageIndex
          });
          projectImages.push(imageEntry);
          activeImageIndex = projectImages.length - 1;
          console.log('[debug] loadImage: projectImages after push', projectImages.map((image, index) => ({
            index,
            name: image?.name,
            strokesCount: Array.isArray(image?.strokes) ? image.strokes.length : 0,
            notesCount: Array.isArray(image?.notes) ? image.notes.length : 0
          })));
          await activateImageAt(activeImageIndex, { persist: shouldPersist });
          resolve();
        });
      }

      function clearDrawings() {
        activeStroke = null;
        redoStack = [];
        strokes = [];
        redraw();
        setControls();
        syncBrushControls();
        saveLastWork();
      }

      function undoLastLine() {
        if (!strokes.length) return;
        const lastStroke = strokes.pop();
        redoStack.push(lastStroke);
        redraw();
        setControls();
        syncBrushControls();
        saveLastWork();
      }

      function redoLastLine() {
        if (!redoStack.length) return;
        const lastRedo = redoStack.pop();
        strokes.push(lastRedo);
        redraw();
        setControls();
        syncBrushControls();
        saveLastWork();
      }

      function openSaveProjectDialog() {
        if (!sourceImage) return;
        projectNameInput.value = currentProjectName || 'Proiect nou';
        saveProjectDialog.hidden = false;
        requestAnimationFrame(() => {
          projectNameInput.focus();
          projectNameInput.select();
        });
      }

      function closeSaveProjectDialog() {
        saveProjectDialog.hidden = true;
      }

      async function saveProjectWithName(name) {
        const chosenName = normalizeProjectName(name);
        setProjectName(chosenName);
        const project = await buildProjectPayload();
        console.log('[debug] saveProjectWithName: project.images[0]', project.images[0]);
        console.log('[debug] saveProjectWithName: project.images', project.images);

        const fileName = getProjectFileName();
        const fileContent = JSON.stringify(project, null, 2);
        const file = new File([fileContent], fileName, { type: 'application/json' });

        if (isIPadOSDevice()) {
          try {
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({
                title: fileName,
                text: `Salvează proiectul ${chosenName}`,
                files: [file]
              });
              await saveLastWork(project);
              return;
            }

            if (navigator.share) {
              await navigator.share({
                title: fileName,
                text: `Salvează proiectul ${chosenName}`,
                files: [file]
              });
              await saveLastWork(project);
              return;
            }
          } catch (error) {
            if (error && error.name !== 'AbortError') {
              console.warn('Web Share API a eșuat pentru salvarea proiectului.', error);
            }
          }

          const fallbackUrl = URL.createObjectURL(file);
          const popup = window.open(fallbackUrl, '_blank', 'noopener,noreferrer');
          if (popup) {
            popup.focus();
          } else {
            const link = document.createElement('a');
            link.href = fallbackUrl;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          }
          window.setTimeout(() => URL.revokeObjectURL(fallbackUrl), 15000);
          await saveLastWork(project);
          return;
        }

        const blob = new Blob([fileContent], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = fileName;
        link.href = url;
        link.click();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        await saveLastWork(project);
      }

      async function saveProject() {
        if (!sourceImage) return;
        openSaveProjectDialog();
      }

      async function loadProjectFromFile(file) {
        if (!file || file.type !== 'application/json' && !file.name.toLowerCase().endsWith('.json')) return;
        try {
          const text = await file.text();
          const project = JSON.parse(text);
          setProjectName(project?.projectName || project?.name || file.name || 'Proiect nou');
          await restoreProject(project);
        } catch (error) {
          console.warn('Proiectul nu a putut fi încărcat.', error);
        }
      }

      addImage.addEventListener('click', (event) => {
        event.preventDefault();
        imageInput.click();
      });
      thumbnailAddImageButton.addEventListener('click', (event) => {
        event.preventDefault();
        imageInput.click();
      });
      fullscreenButton.addEventListener('click', () => setFullscreenMode(true));
      fullscreenCloseButton.addEventListener('click', () => setFullscreenMode(false));
      fullscreenCloseToolbarBtn.addEventListener('click', () => setFullscreenMode(false));
      fullscreenColorPicker.addEventListener('input', (event) => {
        brushColor = event.target.value;
        isErasing = false;
        applyCurrentBrushSettings();
        syncBrushControls();
        scheduleSave();
      });
      fullscreenBrushSize.addEventListener('input', (event) => {
        brushSize = Number(event.target.value) || 4;
        applyCurrentBrushSettings();
        syncBrushControls();
        scheduleSave();
      });
      fullscreenEraserBtn.addEventListener('click', () => {
        isErasing = !isErasing;
        applyCurrentBrushSettings();
        syncBrushControls();
        scheduleSave();
      });
      fullscreenUndoBtn.addEventListener('click', () => {
        undoLastLine();
      });
      fullscreenRedoBtn.addEventListener('click', () => {
        redoLastLine();
      });
      fullscreenClearBtn.addEventListener('click', () => {
        clearDrawings();
      });
      document.querySelectorAll('.quick-color-button').forEach((button) => {
        button.addEventListener('click', () => {
          const selectedColor = button.dataset.color;
          if (!selectedColor) return;
          brushColor = selectedColor;
          isErasing = false;
          applyCurrentBrushSettings();
          syncBrushControls();
          scheduleSave();
        });
      });
      window.addEventListener('keydown', (event) => {
        if (!fullscreenMode) return;
        if (event.key === 'Escape') {
          event.preventDefault();
          setFullscreenMode(false);
        }
      });
      removeImageButton.addEventListener('click', confirmRemoveImage);
      loadProjectButton.addEventListener('click', (event) => {
        event.preventDefault();
        projectInput.click();
      });
      imageInput.addEventListener('change', async (event) => {
        const files = Array.from(event.target.files || []);
        if (!files.length) return;
        for (const file of files) {
          await loadImage(file, { shouldPersist: true });
        }
        imageInput.value = '';
      });
      projectInput.addEventListener('change', async (event) => {
        const [file] = event.target.files || [];
        if (file) {
          await loadProjectFromFile(file);
        }
      });
      drawModeButton.addEventListener('click', () => setActiveTool('draw'));
      notesModeButton.addEventListener('click', () => setActiveTool('notes'));
      undo.addEventListener('click', undoLastLine);
      clear.addEventListener('click', clearDrawings);
      save.addEventListener('click', saveProject);
      cancelProjectSaveButton.addEventListener('click', closeSaveProjectDialog);
      confirmProjectSaveButton.addEventListener('click', async () => {
        const name = projectNameInput.value;
        closeSaveProjectDialog();
        await saveProjectWithName(name);
      });
      projectNameInput.addEventListener('keydown', async (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          closeSaveProjectDialog();
          await saveProjectWithName(projectNameInput.value);
        }
        if (event.key === 'Escape') {
          closeSaveProjectDialog();
        }
      });
      addNoteButton.addEventListener('click', addNote);
      deleteSelectedNoteButton.addEventListener('click', deleteSelectedNote);
      noteContentTextarea.addEventListener('input', () => {
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        if (!note) return;
        note.content = noteContentTextarea.value;
        renderNoteList();
        scheduleSave();
      });
      textModeButton.addEventListener('click', () => {
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        if (!note) return;
        note.inputMode = 'text';
        setSelectedNoteMode('text');
        scheduleSave();
      });
      pencilModeButton.addEventListener('click', () => {
        const note = interactiveNotes.find((item) => item.id === selectedNoteId);
        if (!note) return;
        note.inputMode = 'pencil';
        setSelectedNoteMode('pencil');
        scheduleSave();
      });
      clearPencilInputButton.addEventListener('click', clearSelectedNoteHandwriting);
      noteCanvas.addEventListener('pointerdown', beginPencilWriting, { passive: false });
      noteCanvas.addEventListener('pointermove', continuePencilWriting, { passive: false });
      noteCanvas.addEventListener('pointerup', finishPencilWriting, { passive: false });
      noteCanvas.addEventListener('pointercancel', finishPencilWriting, { passive: false });
      canvas.addEventListener('pointerdown', beginDrawing, { passive: false });
      canvas.addEventListener('pointermove', continueDrawing, { passive: false });
      canvas.addEventListener('pointerup', finishDrawing, { passive: false });
      canvas.addEventListener('pointercancel', finishDrawing, { passive: false });
      canvas.addEventListener('gesturestart', (event) => event.preventDefault(), { passive: false });
      setActiveTool('draw');
      updateImageTransform();
      restoreLastWork();
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((registration) => {
            let refreshingAfterUpdate = false;

            const askAndActivateUpdate = async (worker) => {
              if (!worker || worker.state !== 'installed' || !navigator.serviceWorker.controller) return;
              const shouldReload = window.confirm('Este disponibilă o versiune nouă. Reîncarcă aplicația?');
              if (!shouldReload) return;
              try {
                await saveLastWork();
              } catch (error) {
                console.warn('Starea curentă nu a putut fi salvată înainte de actualizare.', error);
              }
              worker.postMessage({ type: 'SKIP_WAITING' });
            };

            if (registration.waiting) {
              askAndActivateUpdate(registration.waiting);
            }

            registration.addEventListener('updatefound', () => {
              const installingWorker = registration.installing;
              if (!installingWorker) return;
              installingWorker.addEventListener('statechange', () => {
                if (installingWorker.state === 'installed') {
                  askAndActivateUpdate(installingWorker);
                }
              });
            });

            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (refreshingAfterUpdate) return;
              refreshingAfterUpdate = true;
              window.location.reload();
            });

            registration.update().catch(() => {});

            window.setInterval(() => {
              if (!navigator.onLine) return;
              registration.update().catch(() => {});
            }, 15 * 60 * 1000);

            window.addEventListener('online', () => {
              registration.update().catch(() => {});
            });
          }).catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
